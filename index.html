<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Gym — 3D Diorama</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0912; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    color: rgba(255, 236, 220, .5); font: 500 11px/1 system-ui, -apple-system, sans-serif;
    letter-spacing: .14em; text-transform: uppercase; pointer-events: none;
    transition: opacity 1.2s ease; white-space: nowrap;
  }
  #hint { bottom: 70px; }
  #tod {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px;
    background: rgba(20, 16, 28, .42); border: 1px solid rgba(255, 240, 225, .12); border-radius: 999px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  #tod button {
    font: 500 12px/1 system-ui, -apple-system, sans-serif; letter-spacing: .04em; color: rgba(255, 240, 225, .65);
    background: transparent; border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; transition: background .3s, color .3s;
  }
  #tod button:hover { color: #fff; }
  #tod button.on { background: rgba(255, 240, 225, .16); color: #fff; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: rgba(255, 236, 220, .45); font: 500 11px system-ui, sans-serif; letter-spacing: .14em;
    text-transform: uppercase; transition: opacity .8s ease; pointer-events: none;
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Building the gym…</div>
<div id="hint">Drag the weights, mat &amp; lat bar · Tap plates to load the bar · Drag the floor to orbit</div>
<div id="tod"><button data-m="day">Day</button><button data-m="dusk" class="on">Dusk</button><button data-m="night">Night</button></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------- utilities ---------- */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(7);
const rr = (a, b) => a + (b - a) * rand();
const DEG = Math.PI / 180;

const std = (color, roughness = 0.7, metalness = 0, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
const rbox = (w, h, d, r = 0.02, s = 3) =>
  new RoundedBoxGeometry(w, h, d, s, Math.min(r, Math.min(w, h, d) / 2 - 1e-4));
function add(parent, geo, mat, x = 0, y = 0, z = 0, cast = true, receive = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = receive;
  parent.add(m); return m;
}
/* ---------- interaction registry ---------- */
const interactive = [];
function interact(obj, label, onClick) { obj.userData.interact = { label, onClick }; interactive.push(obj); }
const tweens = [];
function playRep(obj, frames) {
  if (obj.userData.busy) return;
  obj.userData.busy = true;
  const base = obj.position.clone(), T = frames[frames.length - 1][0];
  let time = 0;
  tweens.push(dt => {
    time = Math.min(T, time + dt);
    let i = 0; while (i < frames.length - 2 && time > frames[i + 1][0]) i++;
    const a = frames[i], b = frames[i + 1];
    const k = THREE.MathUtils.smootherstep(time, a[0], b[0]);
    obj.position.set(base.x + (a[3] || 0) + ((b[3] || 0) - (a[3] || 0)) * k, base.y + a[1] + (b[1] - a[1]) * k, base.z + a[2] + (b[2] - a[2]) * k);
    if (time >= T) { obj.position.copy(base); obj.userData.busy = false; return true; }
  });
}
function anim(dur, step, done) {
  let t = 0;
  tweens.push(dt => { t = Math.min(dur, t + dt); step(THREE.MathUtils.smootherstep(t, 0, dur), t / dur); if (t >= dur) { done && done(); return true; } });
}
function tweenTo(obj, props, dur) { const from = {}; for (const k in props) from[k] = obj[k]; anim(dur, k => { for (const p in props) obj[p] = from[p] + (props[p] - from[p]) * k; }); }
const bounceOut = x => { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; };
const draggables = [];
function makeDrag(obj, restY, onTap, onStart) { obj.userData.drag = { restY, onStart }; draggables.push(obj); interact(obj, '', onTap || (() => {})); }
const hop = (o, h = .12) => playRep(o, [[0, 0, 0], [.2, h, 0], [.45, 0, 0], [.55, h * .2, 0], [.65, 0, 0]]);

const bvl = (w, h, d, r = .008) => new RoundedBoxGeometry(w, h, d, 2, Math.min(r, Math.min(w, h, d) / 2 - 1e-4));
const cylX = (r, len, seg = 32) => new THREE.CylinderGeometry(r, r, len, seg).rotateZ(Math.PI / 2);
const cylZ = (r, len, seg = 32) => new THREE.CylinderGeometry(r, r, len, seg).rotateX(Math.PI / 2);
const cylY = (r, len, seg = 32) => new THREE.CylinderGeometry(r, r, len, seg);

function canvasTex(w, h, draw, repeat = [1, 1], srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat);
  t.anisotropy = 8; return t;
}

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true, powerPreference: 'high-performance' });
const DPR = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;
const bgMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: { cIn: { value: new THREE.Color() }, cOut: { value: new THREE.Color() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 1., 1.); }`,
  fragmentShader: `varying vec2 vUv; uniform vec3 cIn, cOut;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){ vec2 p = vUv - vec2(.5,.56); p.x *= 1.5;
      float d = smoothstep(.0, .95, length(p));
      vec3 col = mix(cIn, cOut, d);
      col += (h(gl_FragCoord.xy) - .5) / 255. * 2.;
      gl_FragColor = vec4(col, 1.); }`,
});
const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bgQuad.frustumCulled = false; bgQuad.renderOrder = -1000; bgQuad.userData.noIntro = true; scene.add(bgQuad);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.3;

const camera = new THREE.PerspectiveCamera(17, innerWidth / innerHeight, 0.5, 1200);
camera.layers.enable(1); // layer 1 = the view outside the window

/* ---------- textures ---------- */
const rubberTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#2b2c30'; g.fillRect(0, 0, w, h);
  const r = mulberry32(11);
  for (let i = 0; i < 9000; i++) {
    const v = r(); g.fillStyle = v > .93 ? '#4a4c52' : v > .5 ? '#323338' : '#25262a';
    g.fillRect(r() * w, r() * h, 1.5, 1.5);
  }
  g.fillStyle = '#18191c'; g.fillRect(0, 0, w, 3); g.fillRect(0, 0, 3, h);
}, [8.4, 5.9]);

function woodDraw(base, dark, planks) {
  return (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    const r = mulberry32(21);
    const ph = h / planks;
    for (let p = 0; p < planks; p++) {
      g.fillStyle = `rgba(0,0,0,${r() * .08})`; g.fillRect(0, p * ph, w, ph);
      for (let i = 0; i < 26; i++) {
        g.strokeStyle = dark; g.globalAlpha = .06 + r() * .12; g.lineWidth = .6 + r() * 1.4;
        const y0 = p * ph + r() * ph, amp = r() * 3, f = .004 + r() * .01;
        g.beginPath();
        for (let x = 0; x <= w; x += 8) g.lineTo(x, y0 + Math.sin(x * f + i) * amp);
        g.stroke();
      }
      g.globalAlpha = 1;
      if (planks > 1) { g.fillStyle = 'rgba(40,24,12,.55)'; g.fillRect(0, p * ph, w, 2); }
    }
  };
}
const oakTex = canvasTex(1024, 1024, woodDraw('#b88a5c', '#5a3a1e', 1));
const platformTex = canvasTex(1024, 1024, woodDraw('#b98b5d', '#5a3a1e', 8));
const plasterTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  const r = mulberry32(5);
  for (let i = 0; i < 2500; i++) {
    g.fillStyle = `rgba(${r() > .5 ? '0,0,0' : '255,255,255'},${r() * .0025})`;
    const s = 20 + r() * 60; g.beginPath(); g.arc(r() * w, r() * h, s, 0, 7); g.fill();
  }
}, [3, 2]);
const holesTex = canvasTex(64, 2048, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#121214';
  for (let i = 0; i < 46; i++) { g.beginPath(); g.arc(w / 2, 40 + i * 44, 9, 0, 7); g.fill(); }
});

/* ---------- materials ---------- */
const M = {
  rubber: std(0xffffff, .78, 0, { map: rubberTex }),
  slab: std(0x8b8681, .95),
  plinth: std(0x2c201b, .7),
  wall: std(0xe6dccd, .95, 0, { map: plasterTex }),
  oak: std(0xffffff, .62, 0, { map: oakTex }),
  platform: std(0xffffff, .55, 0, { map: platformTex }),
  steel: std(0x1d1e22, .42, .55),
  rack: std(0x26272b, .45, .55, { map: holesTex }),
  frameBlack: std(0x141416, .5, .3),
  chrome: std(0xe2e4e8, .16, 1),
  knurl: std(0xa7a9ad, .42, 1),
  plastic: std(0x111113, .6),
  leather: std(0x8a4a28, .48, 0),
  leatherDark: std(0x5e3018, .5, 0),
  skirting: std(0x2b2a2c, .6),
  iron: std(0x1a1a1c, .55, .35),
  soil: std(0x2e2119, 1),
  terracotta: std(0xb5643f, .85),
  ceramic: std(0xefeae2, .55),
  ceramicDark: std(0x2c2c2e, .65),
};
const PLATES = {
  r25: { R: .225, t: .046, c: 0xa8392c },
  b20: { R: .225, t: .04, c: 0x2e4468 },
  y15: { R: .2, t: .036, c: 0xc9a14b },
  g10: { R: .162, t: .034, c: 0x56704f },
  w5: { R: .114, t: .03, c: 0xe6dfd0 },
};
const plateMats = {};
for (const k in PLATES) plateMats[k] = std(PLATES[k].c, .38, .05);

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0x8792c4, 0x3b2a20, .28); scene.add(hemi);
const fill = new THREE.DirectionalLight(0xffe0c2, .22);
fill.position.set(9, 10, 9); scene.add(fill);

// cool dusk light that only enters through the window
const moon = new THREE.SpotLight(0xa7b6ff, 4.2, 0, .42, .35, 0);
moon.position.set(-3.2, 8.2, -12.5);
moon.target.position.set(.6, .3, -.2);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.near = 4; moon.shadow.camera.far = 30;
moon.shadow.bias = -.0004; moon.shadow.normalBias = .02;
scene.add(moon, moon.target);

/* ---------- base / strata ---------- */
const H = 3.4;           // wall height
const baseParts = [
  add(scene, new THREE.BoxGeometry(8.4, .06, 5.1), M.rubber, 0, -.03, -.65, false, true),
  add(scene, new THREE.BoxGeometry(8.4, .26, 5.1), M.slab, 0, -.19, -.65, false, true),
  add(scene, rbox(9.0, .46, 5.7, .12, 6), std(0x6a4a35, .55, 0, { map: oakTex }), 0, -.5, -.65, false, true),
];
{
  const label = canvasTex(1024, 160, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#d8b77a'); gr.addColorStop(.5, '#b8945a'); gr.addColorStop(1, '#d1ae70');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = '#3b2a18'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '600 64px Georgia, serif'; g.letterSpacing = '18px'; g.fillText('THE HOME GYM', w / 2, 70);
    g.font = '500 26px Georgia, serif'; g.letterSpacing = '10px'; g.fillText('EST. 2026', w / 2, 128);
  });
  label.wrapS = label.wrapT = THREE.ClampToEdgeWrapping; label.repeat.set(1, 1);
  const br = std(0xc9a46a, .3, .85);
  const plate = add(scene, new THREE.BoxGeometry(1.5, .24, .02), [br, br, br, br, std(0xffffff, .35, .6, { map: label }), br], 0, -.5, 2.16, false, false);
  baseParts.push(plate);
}
baseParts.forEach(m => m.userData.noIntro = true);
// soft drop shadow
{
  const t = canvasTex(256, 256, (g, w, h) => {
    const grd = g.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w / 2);
    grd.addColorStop(0, 'rgba(0,0,0,.65)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
  });
  const s = add(scene, new THREE.PlaneGeometry(13.5, 9), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }), 0, -1.05, -.65, false, false);
  s.rotation.x = -Math.PI / 2; s.userData.noIntro = true; s.userData.aoHide = true;
}

/* ---------- walls ---------- */
const WIN = { x0: -1.5, x1: 1.5, y0: .9, y1: 2.7 };
// left wall
add(scene, new THREE.BoxGeometry(.2, H, 5.1), M.wall, -4.1, H / 2, -.65);
// back wall in four pieces around the window
add(scene, new THREE.BoxGeometry(2.7, H, .2), M.wall, -2.85, H / 2, -3.1);
add(scene, new THREE.BoxGeometry(2.7, H, .2), M.wall, 2.85, H / 2, -3.1);
add(scene, new THREE.BoxGeometry(3, WIN.y0, .2), M.wall, 0, WIN.y0 / 2, -3.1);
add(scene, new THREE.BoxGeometry(3, H - WIN.y1, .2), M.wall, 0, (H + WIN.y1) / 2, -3.1);
// oak caps
add(scene, bvl(.24, .05, 5.14), M.oak, -4.1, H + .025, -.65);
add(scene, bvl(8.44, .05, .24), M.oak, 0, H + .025, -3.1);
// skirting
add(scene, bvl(.016, .09, 4.9), M.skirting, -3.992, .045, -.55, false);
add(scene, bvl(7.98, .09, .016), M.skirting, .01, .045, -2.992, false);

/* ---------- window ---------- */
const winGroup = new THREE.Group(); scene.add(winGroup);
interact(winGroup, 'Window · tap to change the time of day', () => cycleMood());
{
  const fw = .055, dz = -3.1;
  const W = WIN.x1 - WIN.x0, Hh = WIN.y1 - WIN.y0, cy = (WIN.y0 + WIN.y1) / 2;
  // reveal (inner frame)
  add(winGroup, bvl(fw, Hh, .21), M.frameBlack, WIN.x0 + fw / 2, cy, dz);
  add(winGroup, bvl(fw, Hh, .21), M.frameBlack, WIN.x1 - fw / 2, cy, dz);
  add(winGroup, bvl(W, fw, .21), M.frameBlack, 0, WIN.y1 - fw / 2, dz);
  add(winGroup, bvl(W, fw, .21), M.frameBlack, 0, WIN.y0 + fw / 2, dz);
  // crittall grid
  for (const mx of [-.5, .5]) add(winGroup, bvl(.028, Hh, .045), M.frameBlack, mx, cy, dz + .01);
  add(winGroup, bvl(W, .028, .045), M.frameBlack, 0, 2.2, dz + .01);
  // oak sill
  add(winGroup, rbox(3.25, .05, .32, .01), M.oak, 0, WIN.y0 + .02, -2.93);
  // glass sheen
  const glass = add(winGroup, new THREE.PlaneGeometry(W, Hh),
    new THREE.MeshStandardMaterial({ color: 0xc8d4ff, transparent: true, opacity: .07, roughness: .05, metalness: 0, depthWrite: false }),
    0, cy, dz, false, false);
  glass.renderOrder = 20;
  // stencil portal: the outside view only draws where this is visible
  const portal = add(winGroup, new THREE.PlaneGeometry(W, Hh), new THREE.MeshBasicMaterial({
    colorWrite: false, depthWrite: false, stencilWrite: true, stencilRef: 1,
    stencilFunc: THREE.AlwaysStencilFunc, stencilZPass: THREE.ReplaceStencilOp,
  }), 0, cy, dz - .02, false, false);
  portal.renderOrder = 10;

  // shadow-only occluder so the dusk light enters only through the window
  const occ = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
  const o = (w, h, x, y) => { const m = add(scene, new THREE.BoxGeometry(w, h, .1), occ, x, y, -3.35, true, false); m.renderOrder = -1; m.userData.aoHide = true; m.userData.noIntro = true; };
  o(14, 22, -8.5, 10); o(14, 22, 8.5, 10); o(3, 2, 0, -.1); o(3, 20, 0, WIN.y1 + 10);
}

/* ---------- the view outside (stencil, layer 1) ---------- */
const viewRoot = new THREE.Group();
viewRoot.position.set(0, (WIN.y0 + WIN.y1) / 2, -3.2);
scene.add(viewRoot);
const viewMats = [];
function stencilize(mat) {
  Object.assign(mat, { stencilWrite: true, stencilRef: 1, stencilFunc: THREE.EqualStencilFunc,
    stencilFail: THREE.KeepStencilOp, stencilZFail: THREE.KeepStencilOp, stencilZPass: THREE.KeepStencilOp });
  viewMats.push(mat); return mat;
}
const polar = (phiDeg, elevDeg, r) => new THREE.Vector3(
  r * Math.cos(elevDeg * DEG) * Math.sin(phiDeg * DEG), r * Math.sin(elevDeg * DEG), -r * Math.cos(elevDeg * DEG) * Math.cos(phiDeg * DEG));
const atR = (phiDeg, r, y) => new THREE.Vector3(r * Math.sin(phiDeg * DEG), y, -r * Math.cos(phiDeg * DEG));

// sky dome
const SUN_PHI = -48;
const skyMat = stencilize(new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { sunPhi: { value: SUN_PHI * DEG }, zen: { value: new THREE.Color() }, upper: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, glowA: { value: new THREE.Color() }, glowB: { value: new THREE.Color() }, horA: { value: new THREE.Color() }, horB: { value: new THREE.Color() }, below: { value: new THREE.Color() } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    varying vec3 vDir; uniform float sunPhi; uniform vec3 zen, upper, mid, glowA, glowB, horA, horB, below;
    vec3 rgb(float r,float g,float b){ return pow(vec3(r,g,b)/255., vec3(2.2)); }
    void main(){
      float e = degrees(asin(clamp(vDir.y,-1.,1.)));
      float phi = atan(vDir.x, -vDir.z);
      float glow = .55 + .45*cos(phi - sunPhi);
      vec3 col = zen;
      col = mix(col, upper, smoothstep(14., 6., e));
      col = mix(col, mid, smoothstep(5., 2.2, e));
      col = mix(col, mix(glowA, glowB, glow), smoothstep(2.4, .6, e));
      col = mix(col, mix(horA, horB, glow), smoothstep(.9, -.3, e));
      col = mix(col, below, smoothstep(-1.5, -4., e));
      gl_FragColor = vec4(col, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
const sky = new THREE.Mesh(new THREE.SphereGeometry(420, 64, 32), skyMat);
sky.renderOrder = 11; viewRoot.add(sky);

// stars
{
  const n = 340, pos = [], ph = [], sz = [];
  for (let i = 0; i < n; i++) {
    const e = 1.8 + Math.pow(rand(), 1.6) * 16, phi = rr(-150, 60);
    const p = polar(phi, e, 400); pos.push(p.x, p.y, p.z); ph.push(rand() * 6.28); sz.push(rr(.8, 2.3));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('phase', new THREE.Float32BufferAttribute(ph, 1));
  g.setAttribute('size', new THREE.Float32BufferAttribute(sz, 1));
  const m = stencilize(new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { time: { value: 0 }, px: { value: DPR }, vis: { value: 1 } },
    vertexShader: `attribute float phase; attribute float size; uniform float time; uniform float px; uniform float vis; varying float vA;
      void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); gl_Position = projectionMatrix*mv;
        float e = position.y/400.; vA = (.45+.55*sin(time*1.7+phase)) * smoothstep(.02,.07,e) * vis;

const leafMats = ['#2d6a3e', '#356f3f', '#295f3a', '#3b7a47'].map(c => std(c, .5, 0, { side: THREE.DoubleSide }));
function leafGeo(len, wid, { notches = 0, curl = .18, droop = .25, heart = false, segs = 36 } = {}) {
  const sh = new THREE.Shape();
  const wf = t => {
    let w = heart ? wid * Math.pow(Math.sin(Math.PI * (.16 + .84 * t)), .75) : wid * Math.pow(Math.sin(Math.PI * t), .8) * (1 - .25 * t);
    return w;
  };
  const notchF = (t, off) => {
    let f = 1;
    for (let i = 0; i < notches; i++) {
      const tc = .22 + i * (.56 / Math.max(1, notches - 1)) + off;
      f *= 1 - .6 * Math.exp(-Math.pow((t - tc) / .016, 2));
    }
    return f;
  };
  sh.moveTo(0, heart ? len * .06 : 0);
  for (let i = 0; i <= segs; i++) { const t = i / segs; sh.lineTo(wf(t) * notchF(t, 0), t * len - (heart && i === 0 ? len * .02 : 0)); }
  for (let i = segs; i >= 0; i--) { const t = i / segs; sh.lineTo(-wf(t) * notchF(t, .035), t * len - (heart && i === 0 ? len * .02 : 0)); }
  const g = new THREE.ShapeGeometry(sh, 4);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), t = y / len;
    p.setZ(i, curl * Math.pow(x / wid, 2) * wid - droop * len * t * t);
  }
  g.computeVertexNormals();
  return g;
}
const UP = new THREE.Vector3(0, 1, 0);
function placeLeaf(parent, geo, mat, pos, dir) {
  const y = dir.clone().normalize();
  let x = new THREE.Vector3().crossVectors(y, UP);
  if (x.lengthSq() < 1e-4) x.set(1, 0, 0);
  x.normalize();
  const z = new THREE.Vector3().crossVectors(x, y).normalize();
  const m = new THREE.Mesh(geo, mat);
  m.matrixAutoUpdate = true;
  const mat4 = new THREE.Matrix4().makeBasis(x, y, z);
  m.quaternion.setFromRotationMatrix(mat4);
  m.position.copy(pos); m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
const stemMat = std(0x3f6b3a, .7);
function stem(parent, pts, r = .007) {
  const curve = new THREE.CatmullRomCurve3(pts);
  add(parent, new THREE.TubeGeometry(curve, 16, r, 6), stemMat, 0, 0, 0, true, true);
  return curve;
}
function pot(parent, { rb, rt, h, mat, x, z, y = 0 }) {
  const pts = [new THREE.Vector2(0, 0), new THREE.Vector2(rb, 0), new THREE.Vector2(rb * 1.01, .01), new THREE.Vector2(rt * .97, h * .9),
    new THREE.Vector2(rt, h * .93), new THREE.Vector2(rt, h), new THREE.Vector2(rt - .015, h), new THREE.Vector2(rt - .02, h * .9)];
  const g = new THREE.LatheGeometry(pts, 48);
  const m = add(parent, g, mat, x, y, z);
  m.material = mat.clone(); m.material.side = THREE.DoubleSide;
  add(parent, new THREE.CircleGeometry(rt - .02, 32).rotateX(-Math.PI / 2), M.soil, x, y + h * .88, z, false);
  return y + h * .88;
}
const plants = [];
function plantGroup(px, pz, ph, amp = 1) {

  const inner = new THREE.Group(); inner.position.set(-px, 0, -pz); outer.add(inner);

    add(g, bvl(.07, .03, .09), M.plastic, x, barY - .045, RACK.z1 + .1);
    add(g, bvl(.07, .07, .015), M.plastic, x, barY - .01, RACK.z1 + .14);
    // safety arms

    add(g, bvl(.052, .012, .62), M.plastic, x, .851, RACK.z1 + .33, false);
  }
  const bar = barbell([]);
  bar.position.set(cx, barY, RACK.z1 + .1); g.add(bar);

  let moving = 0;
  interact(bar, '', () => { if (!moving) playRep(bar,

function updateMood(dt) {
  if (moodT < 1) moodT = Math.min(1, moodT + dt / 1.6);
  const k = THREE.MathUtils.smootherstep(moodT, 0, 1), to = MOODS[moodName], f = moodFrom, c = moodCur;
  for (const key in to) {
    if (key === 'vw') to.vw.forEach((v, i) => c.vw[i] = f.vw[i] + (v - f.vw[i]) * k);
    else if (Array.isArray(to[key])) to[key].forEach((col, i) => c[key][i].lerpColors(f[key][i], col, k));
    else if (to[key].isColor) c[key].lerpColors(f[key], to[key], k);
    else c[key] = f[key] + (to[key] - f[key]) * k;
  }
  const u = skyMat.uniforms;
  ['zen', 'upper', 'mid', 'glowA', 'glowB', 'horA', 'horB', 'below'].forEach((n, i) => u[n].value.copy(c.sky[i]));
  const ud = viewRoot.userData;
  ud.terrainMat.color.copy(c.terrain); ud.cloudMat.color.copy(c.clouds);
  ud.starMat.uniforms.vis.value = c.stars; ud.moonMat.opacity = c.moon; ud.haloMat.opacity = c.moon;
  moon.color.copy(c.win); moon.intensity = c.winI * introLight;
  if (window.__shelfGlow) window.__shelfGlow.intensity = .5 * introLight;
  hemi.intensity = c.hemi; hemi.color.copy(c.hemiSky); fill.intensity = c.fill;
  renderer.toneMappingExposure = c.exp;
  viewMat.uniforms.w.value.set(c.vw[0], c.vw[1], c.vw[2]);
  bgMat.uniforms.cIn.value.copy(c.bgIn); bgMat.uniforms.cOut.value.copy(c.bgOut);
}

/* ---------- intro: the diorama assembles itself ---------- */
const intro = [];
{
  let i = 0;
  for (const o of scene.children) {
    if (o.isLight || o === viewRoot || o.userData.noIntro || !(o.isMesh || o.isGroup) || !(o.layers.mask & 1)) continue;
    intro.push({ o, y: o.position.y, delay: .35 + Math.min(i * .028, 2.1) }); i++;
    o.position.y += 6; o.visible = false;
  }
}
let introTime = 0, introDone = false, introLight = 0;
window.__skipIntro = () => { introTime = 99; }; window.__moodNow = n => { setMood(n); moodT = .999; };
const easeOutBack = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
function updateIntro(dt) {
  if (introDone) { introLight = Math.min(1, introLight + dt / 1.2); return; }
  introTime += dt;
  let all = true;
  for (const it of intro) {
    const k = THREE.MathUtils.clamp((introTime - it.delay) / .75, 0, 1);
    if (k > 0) it.o.visible = true;
    it.o.position.y = it.y + (1 - easeOutBack(k)) * 6 * (k < 1 ? 1 : 0);
    if (k < 1) all = false;
  }
  if (all) { introDone = true; setTimeout(() => lamps.forEach(l => l.on = true), 250); }
}

/* ---------- post ---------- */
const rt = new THREE.WebGLRenderTarget(innerWidth * DPR, innerHeight * DPR, { type: THREE.HalfFloatType, samples: 4, stencilBuffer: true });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight, undefined,
  { radius: .32, distanceExponent: 1.4, thickness: 1.2, scale: 1.15, samples: 16, distanceFallOff: 1, screenSpaceRadius: false },
  { lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
gtao.blendIntensity = .85;
{
  const ov = gtao.overrideVisibility.bind(gtao);
  gtao.overrideVisibility = function () {
    ov();
    viewRoot.visible = false; bgQuad.visible = false;
    scene.traverse(o => { if (o.userData.aoHide || o.isSprite) o.visible = false; });
  };
}
composer.addPass(gtao);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .5, .55, .92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); gtao.setSize(innerWidth, innerHeight);
  controls.maxDistance = fitDistance() * 1.35;
});

/* ---------- animate ---------- */
const clock = new THREE.Clock();
const winCenter = new THREE.Vector3(0, (WIN.y0 + WIN.y1) / 2, -3.1);
const tmp = new THREE.Vector3(), axis = new THREE.Vector3();
document.getElementById('loading').style.opacity = 0;
setTimeout(() => { if (hint.style.opacity !== '0') hint.style.opacity = 0; }, 16000);

function frame() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  // gentle back-and-forth idle orbit
  if (controls.autoRotate) {
    const az = controls.getAzimuthalAngle();
    if (az > 1.2) controls.autoRotateSpeed = Math.abs(controls.autoRotateSpeed);
    if (az < .3) controls.autoRotateSpeed = -Math.abs(controls.autoRotateSpeed);
  }
  controls.update(dt);

  // keep the outside view's horizon level with the viewer's line of sight
  tmp.subVectors(winCenter, camera.position);
  const horiz = Math.hypot(tmp.x, tmp.z);
  const elev = Math.atan2(-tmp.y, horiz);
  axis.set(tmp.z / horiz, 0, -tmp.x / horiz);
  const dist = tmp.length();
  const offDeg = dist <= 15 ? THREE.MathUtils.clamp(-1 + (dist - 7) / 8 * 3.5, -1, 2.5) : 2.5 - (dist - 17) * .028;
  viewRoot.quaternion.setFromAxisAngle(axis, elev + offDeg * DEG);
  clouds.rotation.y = t * .0035;
  viewRoot.userData.starMat.uniforms.time.value = t;

  for (const p of plants) {
    const a = (p.amp || 1) * .012;
    p.kick = (p.kick || 0) * Math.exp(-dt * 2.2);
    p.g.rotation.z = Math.sin(t * .7 + p.ph) * a * .4 + Math.sin(t * 13) * .045 * p.kick;
    p.g.rotation.x = Math.sin(t * .53 + p.ph * 1.7) * a * .3 + Math.cos(t * 11) * .03 * p.kick;
  }
  for (const m of motes) {
    const arr = m.geo.attributes.position.array;
    m.seeds.forEach((s, i) => {
      const h = ((s[2] + t * s[3]) % 1);
      const y = m.top - h * 2.4, spread = .12 + h * .7;
      arr[i * 3] = m.x + s[0] * spread + Math.sin(t * .4 + i) * .05;
      arr[i * 3 + 1] = y;
      arr[i * 3 + 2] = m.z + s[1] * spread + Math.cos(t * .33 + i) * .05;
    });
    m.geo.attributes.position.needsUpdate = true;
  }
  updateLamps(dt);
  updateMood(dt);
  updateIntro(dt);
  updateNotes(dt);
  for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i](dt)) tweens.splice(i, 1);
  updateDrag(dt);
  composer.render(dt);
  requestAnimationFrame(frame);
}
frame();
window.__ready = true;
</script>
